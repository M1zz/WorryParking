<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 · Support — Worry Parking</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="ko" href="https://m1zz.github.io/WorryParking/ko/support.html">
  <link rel="alternate" hreflang="en" href="https://m1zz.github.io/WorryParking/en/support.html">
  <link rel="stylesheet" href="style.css">
  <script>
    // Send visitors to their language: ?lang=, saved choice, then browser language.
    (function () {
      var lang = new URLSearchParams(location.search).get("lang");
      try { lang = lang || localStorage.getItem("lang"); } catch (e) {}
      lang = lang || ((navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en");
      location.replace((lang === "ko" ? "ko" : "en") + "/support.html" + location.hash);
    })();
  </script>
</head>
<body>
  <main class="doc">
    <div class="wrap">
      <p><a href="ko/support.html">지원 (한국어)</a></p>
      <p><a href="en/support.html">Support (English)</a></p>
    </div>
  </main>
</body>
</html>
